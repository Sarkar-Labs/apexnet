here[project]
name = "apexnet-tf"
version = "0.6.0"
description = "Compact explicit high-level API for TensorFlow"
requires-python = ">=3.10"
dependencies = ["tensorflow>=2.16", "numpy"]
[project.optional-dependencies]
tensorboard = ["tensorboard"]
torch = ["torch"]
jax = ["jax", "jaxlib", "optax"]
[tool.setuptools]
packages = ["apexnet"]
